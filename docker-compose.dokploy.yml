# =============================================================
# Dokploy MCP Bridge — Template para desplegar como sidecar
# Copiar este servicio dentro del docker-compose de tu stack.
# =============================================================
#
# El enrutamiento y HTTPS se hace directo desde la interfaz de Dokploy
# (agregando un Dominio que apunte al puerto 8000 en el path /mcp).
#

services:
  mcp-bridge:
    image: ghcr.io/mxkhec01/dokploy-mcp-bridge:latest
    restart: unless-stopped
    environment:
      - DATABASE_URI=${POSTGRES_URL}
      # - DATABASE_URI_OTRA=${MYSQL_URL}
      - MCP_ACCESS_MODE=restricted
      # Autenticación Básica a nivel aplicación (Texto plano, ej. admin:mi_contraseña)
      - MCP_BASIC_AUTH=${MCP_BASIC_AUTH}
    volumes:
      # CRITICAL: Read-only Docker socket mount
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop:
      - ALL
